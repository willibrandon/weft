version: 2

updates:
  # Add Swift package updates when the Mac app introduces Package.swift dependencies.
  # It currently uses only Apple system frameworks; NuGet owns the shared core.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
