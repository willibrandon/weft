name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Restore
        run: dotnet restore Weft.slnx
      - name: Build
        run: dotnet build Weft.slnx --no-restore
        env:
          CI: true
      - name: Test
        run: dotnet test --solution Weft.slnx
        env:
          CI: true

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Verify repository policy
        run: dotnet run --file scripts/Verify-Repository.cs
      - name: Restore
        run: dotnet restore Weft.slnx
      - name: Verify whitespace formatting
        run: dotnet format Weft.slnx whitespace --verify-no-changes --no-restore
      - name: Verify code-style formatting
        run: dotnet format Weft.slnx style --verify-no-changes --no-restore

  native-aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Publish
        run: dotnet publish src/Weft.App/Weft.App.csproj -r ${{ matrix.rid }} -c Release
        env:
          CI: true
      - name: Smoke test
        run: artifacts/publish/Weft.App/release_${{ matrix.rid }}/weft --version

  native-aot-size:
    name: Native AOT size (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Publish with size report
        run: >-
          dotnet publish src/Weft.App/Weft.App.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output artifacts/size-check/weft
          -p:IlcGenerateMstatFile=true
        env:
          CI: true
      - name: Check Native AOT size
        uses: willibrandon/dotsider@v0
        with:
          target: artifacts/obj/Weft.App/release_linux-x64/native/weft.mstat
          baseline-key: weft-linux-x64
          budgets: max=12mb
          top: '20'
          report-directory: ${{ runner.temp }}/dotsider-size-weft-linux-x64
          artifact-name: dotsider-size-weft-linux-x64
